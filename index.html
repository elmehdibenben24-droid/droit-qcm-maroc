<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة قانوني QCM - التحضير للامتحانات</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --gold: #fbbf24;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 5px;
        }
        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--accent);
            padding: 15px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: var(--accent);
            color: white;
        }
        .hidden { display: none; }
        .question-box { text-align: right; }
        .question-text { font-size: 1.2em; margin-bottom: 20px; font-weight: bold; }
        .option-btn {
            display: block;
            width: 100%;
            text-align: right;
            margin-bottom: 10px;
            border: 1px solid var(--text-muted);
            background: transparent;
        }
        .option-btn:hover { background-color: rgba(255,255,255,0.1); }
        .correct { background-color: var(--success) !important; border-color: var(--success); color: white;}
        .wrong { background-color: var(--danger) !important; border-color: var(--danger); color: white;}
        #next-btn { background-color: var(--accent); margin-top: 20px; width: 100%; }
        .score-board { font-size: 2em; font-weight: bold; color: var(--gold); margin: 20px 0; }
    </style>
</head>
<body>

<div class="container" id="main-menu">
    <h1>قانوني QCM ⚖️</h1>
    <p class="subtitle">منصة التحضير الذكي لطلبة الحقوق والمباريات</p>
    <div class="grid-menu">
        <button onclick="showModules('s1')">الفصل 1 (مرحلة مشتركة)</button>
        <button onclick="showModules('s2')">الفصل 2 (مرحلة مشتركة)</button>
        <button onclick="showModules('s5_prive')">القانون الخاص (الفصل 5)</button>
        <button onclick="showModules('s6_prive')">القانون الخاص (الفصل 6)</button>
        <button onclick="showModules('s5_public')">القانون العام (الفصل 5)</button>
        <button onclick="showModules('s6_public')">القانون العام (الفصل 6)</button>
    </div>
</div>

<div class="container hidden" id="modules-menu">
    <h2 id="semester-title">اختر المادة</h2>
    <div class="grid-menu" id="modules-list"></div>
    <button onclick="goHome()" style="margin-top: 20px; border-color: var(--text-muted); width: 100%;">الرجوع للرئيسية</button>
</div>

<div class="container hidden" id="quiz-area">
    <div class="question-box">
        <div class="question-text" id="question-text">جاري التحميل...</div>
        <div id="options-area"></div>
        <button id="next-btn" class="hidden" onclick="nextQuestion()">السؤال التالي ➔</button>
    </div>
</div>

<div class="container hidden" id="result-area">
    <h2>النتيجة النهائية 🎯</h2>
    <div class="score-board" id="final-score">0 / 20</div>
    <p id="result-message"></p>
    <button onclick="goHome()">العودة للرئيسية</button>
</div>

<script>
    const db = {
        s1: {
            title: "الفصل الأول",
            modules: {
                "مدخل للعلوم القانونية": [
                    { q: "ما هو الجزاء في القاعدة القانونية؟", options: ["نصيحة أخلاقية", "أثر مادي تفرضه السلطة العامة", "عقاب ديني", "مجرد توصية"], correct: 1 },
                    { q: "القاعدة الآمرة هي:", options: ["يجوز الاتفاق على مخالفتها", "لا يجوز الاتفاق على مخالفتها مطلقاً", "تطبق فقط في القانون الدولي", "خاصة بالقانون التجاري"], correct: 1 }
                ]
            }
        },
        s2: {
            title: "الفصل الثاني",
            modules: {
                "النظرية العامة للالتزامات": [
                    { q: "مصادر الالتزام حسب ق.ل.ع المغربي تشمل:", options: ["العقد والإرادة المنفردة فقط", "العقد، أشباه العقود، الجرائم، أشباه الجرائم، والقانون", "القانون والقرارات الإدارية فقط", "الأعراف والتقاليد"], correct: 1 }
                ],
                "القانون الجنائي العام": [
                    { q: "ما هو الاستثناء الوارد على مبدأ عدم رجعية القوانين الجنائية؟", options: ["القانون الأصلح للمتهم", "الجرائم السياسية", "الجرائم الاقتصادية", "لا يوجد أي استثناء مطلقا"], correct: 0 },
                    { q: "يعتبر فاعلا معنويا للجريمة:", options: ["من يساهم في الأعمال التحضيرية", "من يحرض على ارتكاب الجريمة فقط", "من يسخر شخصا غير مسؤول جنائيا لتنفيذ الجريمة", "من يخفي أشياء متحصلة من الجريمة"], correct: 2 },
                    { q: "الجريمة المستحيلة يعاقب عليها المشرع المغربي:", options: ["دائما وبنفس عقوبة الجريمة التامة", "إذا كانت الاستحالة نسبية فقط", "لا يعاقب عليها إطلاقا", "إذا كانت الاستحالة مطلقة فقط"], correct: 1 },
                    { q: "التقادم في الجنايات حسب القانون المغربي يكتمل بمرور:", options: ["5 سنوات", "10 سنوات", "15 سنة", "20 سنة"], correct: 2 },
                    { q: "من أسباب التبرير والإباحة التي تمحو الصفة الإجرامية عن الفعل:", options: ["الجهل بالقانون", "صغر السن", "حالة الضرورة والدفاع الشرعي", "الاضطراب العقلي"], correct: 2 }
                ],
                "التنظيم الإداري": [
                    { q: "ما هو جوهر اللامركزية الترابية؟", options: ["تركيز السلطة في العاصمة", "توزيع السلطة بين الحكومة وممثلين محليين معينين", "منح الشخصية المعنوية والاستقلال المالي لهيئات منتخبة", "إلغاء رقابة الدولة"], correct: 2 },
                    { q: "وحدات اللامركزية الترابية في المغرب هي:", options: ["الوزارات والمندوبيات", "الجهات والعمالات والأقاليم والجماعات", "الدوائر والقيادات", "المؤسسات العمومية فقط"], correct: 1 },
                    { q: "عدم التركيز الإداري يعني:", options: ["استقلال الوحدات المحلية تماما", "تفويض السلطة المركزية لبعض اختصاصاتها لممثليها محليا", "انتخاب ممثلي السلطة المحلية", "إلغاء التراتبية الإدارية"], correct: 1 },
                    { q: "الوصاية الإدارية هي:", options: ["رقابة تمارسها السلطة المركزية على الهيئات اللامركزية", "سلطة رئاسية مطلقة", "استقلال تام عن الدولة", "تدخل القضاء في الإدارة"], correct: 0 },
                    { q: "يختلف تفويض التوقيع عن تفويض الاختصاص في أن تفويض التوقيع:", options: ["ينقل الاختصاص بشكل كلي", "لا ينتهي بانتهاء مهام المفوض أو المفوض إليه", "ينتهي بانتهاء مهام المفوض أو المفوض إليه", "يكون شفويا"], correct: 2 }
                ]
            }
        },
        s5_prive: {
            title: "مسار القانون الخاص - الفصل الخامس",
            modules: {
                "العقود المسماة": [
                    { q: "يعتبر عقد البيع في التشريع المغربي كأصل عام:", options: ["عقدا شكليا", "عقدا رضائيا", "عقدا عينيا", "عقدا ملزما لجانب واحد"], correct: 1 },
                    { q: "من التزامات البائع الأساسية:", options: ["أداء الثمن وتسلم المبيع", "نقل الملكية والضمان", "تخزين المبيع فقط", "دفع مصاريف العقد دائما"], correct: 1 }
                ],
                "صعوبة المقاولة": [
                    { q: "من له الحق حصرياً في طلب فتح مسطرة الإنقاذ؟", options: ["الدائنون", "رئيس المحكمة التجارية", "رئيس المقاولة", "النيابة العامة"], correct: 2 },
                    { q: "تفتح مسطرة التسوية القضائية إذا كانت المقاولة:", options: ["في وضعية مريحة ماليا", "متوقفة عن الدفع ووضعيتها غير مختلة بشكل لا رجعة فيه", "متوقفة عن الدفع ووضعيتها مختلة بشكل لا رجعة فيه", "في مرحلة التأسيس"], correct: 1 }
                ],
                "القانون العقاري": [
                    { q: "التحفيظ العقاري في المغرب هو:", options: ["إجباري في جميع الحالات", "اختياري كأصل عام مع بعض الاستثناءات", "مؤقت يمكن التراجع عنه", "يخص العقارات غير المبنية فقط"], correct: 1 }
                ]
            }
        },
        s6_prive: {
            title: "مسار القانون الخاص - الفصل السادس",
            modules: {
                "قانون الملكية والمواريث": [
                    { q: "من موانع الإرث المتفق عليها:", options: ["المرض", "القتل العمد للمورث", "اختلاف الجنسية", "الديون المحيطة بالتركة"], correct: 1 }
                ],
                "الحقوق العينية": [
                    { q: "حق الانتفاع هو:", options: ["حق شخصي", "حق عيني أصلي يخول للمنتفع استعمال واستغلال شيء يعود للغير", "حق عيني تبعي", "مجرد رخصة إدارية"], correct: 1 }
                ]
            }
        },
        s5_public: {
            title: "مسار القانون العام - الفصل الخامس",
            modules: {
                "المرافق العمومية الكبرى": [
                    { q: "من طرق تدبير المرفق العام التي تعهد فيها الإدارة لشخص خاص بتسيير المرفق على نفقته ومسؤوليته:", options: ["الاستغلال المباشر", "عقد الامتياز", "المؤسسة العمومية", "شركة التنمية المحلية"], correct: 1 }
                ],
                "الوظيفة العمومية": [
                    { q: "يعتبر موظفا عموميا حسب النظام الأساسي العام للوظيفة العمومية:", options: ["كل شخص يعمل في شركة خاصة", "كل شخص يعين في منصب دائم ويرسم في إحدى رتب أسلاك الإدارة التابعة للدولة", "المتعاقدون مع الإدارة", "العمال المياومون"], correct: 1 }
                ]
            }
        },
        s6_public: {
            title: "مسار القانون العام - الفصل السادس",
            modules: {
                "المنازعات الإدارية": [
                    { q: "أجل رفع دعوى الإلغاء بسبب تجاوز السلطة أمام المحاكم الإدارية هو:", options: ["30 يوما", "60 يوما من تاريخ نشر أو تبليغ القرار", "90 يوما", "سنة كاملة"], correct: 1 }
                ],
                "قانون الصفقات العمومية": [
                    { q: "الضمان المؤقت في الصفقات العمومية يهدف إلى:", options: ["تغطية أتعاب المهندس", "ضمان جدية التزام المتنافس وعدم تراجعه عن عرضه", "تسديد أجور العمال", "تمويل المشروع"], correct: 1 }
                ]
            }
        }
    };

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function goHome() {
        hideAll();
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function showModules(semesterKey) {
        hideAll();
        const data = db[semesterKey];
        document.getElementById('semester-title').innerText = data.title;
        const list = document.getElementById('modules-list');
        list.innerHTML = '';
        
        for (let moduleName in data.modules) {
            let btn = document.createElement('button');
            btn.innerText = moduleName;
            btn.onclick = () => startQuiz(data.modules[moduleName]);
            list.appendChild(btn);
        }
        document.getElementById('modules-menu').classList.remove('hidden');
    }

    function startQuiz(questionsArray) {
        currentQuestions = questionsArray;
        currentIndex = 0;
        score = 0;
        hideAll();
        document.getElementById('quiz-area').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const qData = currentQuestions[currentIndex];
        document.getElementById('question-text').innerText = `سؤال ${currentIndex + 1}: ${qData.q}`;
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = '';
        document.getElementById('next-btn').classList.add('hidden');

        qData.options.forEach((opt, index) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, index, qData.correct);
            optionsArea.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedIndex, correctIndex) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === correctIndex) {
            selectedBtn.classList.add('correct');
            score++;
        } else {
            selectedBtn.classList.add('wrong');
            buttons[correctIndex].classList.add('correct'); 
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        hideAll();
        document.getElementById('result-area').classList.remove('hidden');
        let finalMark = (score / currentQuestions.length) * 20;
        document.getElementById('final-score').innerText = `${finalMark.toFixed(2)} / 20`;
        
        let msg = document.getElementById('result-message');
        if (finalMark >= 10) msg.innerText = "عمل ممتاز! استمر في المراجعة.";
        else msg.innerText = "تحتاج إلى المزيد من المراجعة، لا تستسلم!";
    }

    function hideAll() {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('modules-menu').classList.add('hidden');
        document.getElementById('quiz-area').classList.add('hidden');
        document.getElementById('result-area').classList.add('hidden');
    }
</script>
</body>
</html>
