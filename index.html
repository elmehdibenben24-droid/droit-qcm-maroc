<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة قانوني QCM - التحضير للامتحانات</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --gold: #fbbf24;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 5px;
        }
        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--accent);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: var(--accent);
            color: white;
        }
        .hidden { display: none; }
        .question-box { text-align: right; }
        .question-text { font-size: 1.2em; margin-bottom: 20px; font-weight: bold; }
        .option-btn {
            display: block;
            width: 100%;
            text-align: right;
            margin-bottom: 10px;
            border: 1px solid var(--text-muted);
            background: transparent;
        }
        .option-btn:hover { background-color: rgba(255,255,255,0.1); }
        .correct { background-color: var(--success) !important; border-color: var(--success); color: white;}
        .wrong { background-color: var(--danger) !important; border-color: var(--danger); color: white;}
        #next-btn { background-color: var(--accent); margin-top: 20px; width: 100%; }
        .score-board { font-size: 2em; font-weight: bold; color: var(--gold); margin: 20px 0; }
        .section-title { grid-column: span 2; color: var(--gold); margin-top: 10px; font-size: 1.1em; border-bottom: 1px solid var(--text-muted); padding-bottom: 5px;}
    </style>
</head>
<body>

<div class="container" id="main-menu">
    <h1>قانوني QCM ⚖️</h1>
    <p class="subtitle">منصة التحضير الذكي لطلبة الحقوق والمباريات</p>
    <div class="grid-menu">
        <div class="section-title">الجذع المشترك</div>
        <button onclick="showModules('s1')">الفصل 1</button>
        <button onclick="showModules('s2')">الفصل 2</button>
        <button onclick="showModules('s3')">الفصل 3</button>
        <button onclick="showModules('s4')">الفصل 4</button>
        
        <div class="section-title">مسارات التخصص</div>
        <button onclick="showModules('s5_prive')">القانون الخاص (S5)</button>
        <button onclick="showModules('s6_prive')">القانون الخاص (S6)</button>
    </div>
</div>

<div class="container hidden" id="modules-menu">
    <h2 id="semester-title">اختر المادة</h2>
    <div class="grid-menu" id="modules-list"></div>
    <button onclick="goHome()" style="margin-top: 20px; border-color: var(--text-muted); width: 100%; grid-column: span 2;">الرجوع للرئيسية</button>
</div>

<div class="container hidden" id="quiz-area">
    <div class="question-box">
        <div class="question-text" id="question-text">جاري التحميل...</div>
        <div id="options-area"></div>
        <button id="next-btn" class="hidden" onclick="nextQuestion()">السؤال التالي ➔</button>
    </div>
</div>

<div class="container hidden" id="result-area">
    <h2>النتيجة النهائية 🎯</h2>
    <div class="score-board" id="final-score">0 / 20</div>
    <p id="result-message"></p>
    <button onclick="goHome()">العودة للرئيسية</button>
</div>

<script>
    const db = {
        s1: {
            title: "الفصل 1",
            modules: {
                "مدخل للعلوم القانونية": [{ q: "ما هي الخاصية التي تميز القاعدة القانونية عن القاعدة الأخلاقية؟", options: ["عامة ومجردة", "مقترنة بجزاء مادي تفرضه الدولة", "تنظم سلوك الأفراد", "مكتوبة دائما"], correct: 1 }],
                "مدخل لدراسة الشريعة الإسلامية": [{ q: "ما هي المصادر التبعية للتشريع الإسلامي؟", options: ["القرآن والسنة", "الإجماع والقياس", "الاستحسان والمصلحة المرسلة والعرف", "الفقه فقط"], correct: 2 }],
                "مدخل للعلوم السياسية": [{ q: "ما هي الأركان الثلاثة الأساسية لقيام الدولة؟", options: ["الشعب، الإقليم، السلطة السياسية", "الرئيس، الحكومة، البرلمان", "الدستور، القوانين، المحاكم", "الجيش، الشرطة، القضاء"], correct: 0 }]
            }
        },
        s2: {
            title: "الفصل 2",
            modules: {
                "النظرية العامة للالتزامات": [{ q: "حسب ق.ل.ع المغربي، ما هي أركان العقد الأساسية؟", options: ["الكتابة والإشهاد", "الرضا، الأهلية، المحل، والسبب", "التسليم ودفع الثمن", "الإيجاب والقبول فقط"], correct: 1 }],
                "القانون التجاري": [{ q: "يعتبر عملا تجاريا بطبيعته حسب مدونة التجارة:", options: ["الزراعة", "المهن الحرة كالمحاماة", "شراء المنقولات بنية بيعها", "العمل الجمعوي"], correct: 2 }],
                "القانون الجنائي العام": [{ q: "ما هو الركن المادي للجريمة؟", options: ["القصد الجنائي", "النشاط، النتيجة الإجرامية، والعلاقة السببية", "النص القانوني المجرم للفعل", "الدافع لارتكاب الجريمة"], correct: 1 }]
            }
        },
        s3: {
            title: "الفصل 3",
            modules: {
                "المسؤولية المدنية": [{ q: "تقوم المسؤولية التقصيرية على ثلاثة أركان هي:", options: ["العقد، الإخلال، التعويض", "الخطأ، الضرر، العلاقة السببية", "القصد، النتيجة، العقوبة", "الإعذار، التنفيذ، الغرامة"], correct: 1 }],
                "قانون الأسرة": [{ q: "حسب مدونة الأسرة المغربية، سن الرشد القانوني للزواج للذكر والأنثى هو:", options: ["16 سنة", "18 سنة شمسية كاملة", "20 سنة", "21 سنة"], correct: 1 }]
            }
        },
        s4: {
            title: "الفصل 4",
            modules: {
                "قانون الشركات": [{ q: "الحد الأدنى لعدد الشركاء لتأسيس شركة المساهمة (SA) هو:", options: ["شريك واحد", "شريكان", "5 شركاء", "7 شركاء"], correct: 2 }],
                "التنظيم القضائي": [{ q: "مبدأ التقاضي على درجتين يعني:", options: ["وجود محكمتين في نفس المدينة", "إمكانية الطعن بالاستئناف في الأحكام الابتدائية", "أن القاضي يصدر حكمين", "الطعن بالنقض مباشرة"], correct: 1 }]
            }
        },
        s5_prive: {
            title: "القانون الخاص - الفصل 5",
            modules: {
                "المسطرة المدنية": [{ q: "شروط قبول الدعوى أمام القضاء المدني هي:", options: ["القرابة والصداقة", "الصفة، الأهلية، والمصلحة", "وجود محامي دائما", "دفع كفالة مالية"], correct: 1 }],
                "المسطرة الجنائية": [{ q: "المدة الأصلية للحراسة النظرية في الجرائم العادية حسب ق.م.ج المغربي هي:", options: ["24 ساعة", "48 ساعة قابلة للتمديد 24 ساعة مرة واحدة", "72 ساعة", "96 ساعة"], correct: 1 }],
                "صعوبة المقاولة": [{ q: "تهدف مسطرة التسوية القضائية إلى:", options: ["تصفية المقاولة وبيع أصولها", "إنقاذ المقاولة التي وضعيتها غير مختلة بشكل لا رجعة فيه", "معاقبة رئيس المقاولة جنائيا", "حل الشركة فورا"], correct: 1 }]
            }
        },
        s6_prive: {
            title: "القانون الخاص - الفصل 6",
            modules: {
                "قانون الملكية والمواريث": [{ q: "نصيب الزوج عند وجود الفرع الوارث (الولد) هو:", options: ["النصف", "الربع", "الثمن", "السدس"], correct: 1 }],
                "الحقوق العينية": [{ q: "حق الارتفاق هو:", options: ["حق شخصي", "تكليف عقاري على عقار لخدمة عقار آخر يملكه شخص مختلف", "حق استغلال أراضي الدولة", "حق دائنية"], correct: 1 }]
            }
        }
    };

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function goHome() {
        hideAll();
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function showModules(semesterKey) {
        hideAll();
        const data = db[semesterKey];
        if(!data) return goHome();
        
        document.getElementById('semester-title').innerText = data.title;
        const list = document.getElementById('modules-list');
        list.innerHTML = '';
        
        for (let moduleName in data.modules) {
            let btn = document.createElement('button');
            btn.innerText = moduleName;
            btn.onclick = () => startQuiz(data.modules[moduleName]);
            list.appendChild(btn);
        }
        document.getElementById('modules-menu').classList.remove('hidden');
    }

    function startQuiz(questionsArray) {
        currentQuestions = questionsArray;
        currentIndex = 0;
        score = 0;
        hideAll();
        document.getElementById('quiz-area').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const qData = currentQuestions[currentIndex];
        document.getElementById('question-text').innerText = `سؤال ${currentIndex + 1}: ${qData.q}`;
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = '';
        document.getElementById('next-btn').classList.add('hidden');

        qData.options.forEach((opt, index) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, index, qData.correct);
            optionsArea.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedIndex, correctIndex) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === correctIndex) {
            selectedBtn.classList.add('correct');
            score++;
        } else {
            selectedBtn.classList.add('wrong');
            buttons[correctIndex].classList.add('correct'); 
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        hideAll();
        document.getElementById('result-area').classList.remove('hidden');
        let finalMark = (score / currentQuestions.length) * 20;
        document.getElementById('final-score').innerText = `${finalMark.toFixed(2)} / 20`;
        
        let msg = document.getElementById('result-message');
        if (finalMark >= 10) msg.innerText = "عمل ممتاز! استمر في المراجعة.";
        else msg.innerText = "تحتاج إلى المزيد من المراجعة، لا تستسلم!";
    }

    function hideAll() {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('modules-menu').classList.add('hidden');
        document.getElementById('quiz-area').classList.add('hidden');
        document.getElementById('result-area').classList.add('hidden');
    }
</script>
</body>
</html>
